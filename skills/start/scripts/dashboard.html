<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cards</title>
<!-- cards-dashboard v6 -->
<!-- Generated by cards.py init and status. Do not edit: changes are overwritten when the version above changes. -->
<style>
:root { --bg:#f7f6f3; --panel:#ffffff; --ink:#1d1d1b; --muted:#6b6a66; --line:#e3e1db;
  --you:#b4410f; --you-bg:#fdf0e8; --run:#1f5fbf; --review:#7a4fb0; --done:#2f7d4a; --out:#8a8780;
  --warn:#9a6a00; --warn-bg:#fdf5dc; --hl:#fff3b8; --bar:#2f7d4a; --code:#f1efe9; }
@media (prefers-color-scheme: dark) { :root { --bg:#161615; --panel:#1f1f1d; --ink:#ecebe7; --muted:#a09e98;
  --line:#33322f; --you:#f08a5d; --you-bg:#2e211a; --run:#7aa7ef; --review:#b896e6; --done:#6cc28a; --out:#8a8780;
  --warn:#e5b94a; --warn-bg:#33290f; --hl:#4a3f12; --bar:#6cc28a; --code:#2a2a27; } }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
main { max-width:1400px; margin:0 auto; padding:20px 16px 40px; }
h1 { font-size:20px; margin:0 0 4px; }
h2 { font-size:13px; font-weight:600; margin:0 0 10px; color:var(--ink); }
h2 span { font-weight:400; color:var(--muted); margin-left:4px; font-variant-numeric:tabular-nums; }
::selection { background:var(--hl); color:var(--ink); }
html { scrollbar-color:var(--line) transparent; }
.lbl { color:var(--muted); font-size:12px; margin:12px 0 2px; }
.goal { color:var(--muted); margin:0 0 12px; max-width:80ch; }
.meta { display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; color:var(--muted); font-size:13px; font-variant-numeric:tabular-nums; }
.meta b { color:var(--ink); font-weight:600; }
.bar { width:220px; height:8px; background:var(--line); border-radius:4px; overflow:hidden; }
.bar > span { display:block; height:100%; background:var(--bar); }
.dw { margin:0; padding-left:18px; color:var(--muted); max-width:80ch; } .dw li { margin:1px 0; }
.tabs { display:flex; gap:4px; margin:16px 0 0; border-bottom:1px solid var(--line); }
.tabs button { font:inherit; color:var(--muted); background:none; border:0; border-bottom:2px solid transparent;
  padding:8px 14px; cursor:pointer; }
.tabs button[aria-selected="true"] { color:var(--ink); border-bottom-color:var(--run); font-weight:600; }
.tabs button:focus-visible, .chip:focus-visible, .card:focus-visible { outline:2px solid var(--run); outline-offset:2px; }
.panel { display:none; margin-top:16px; } .panel.on { display:block; }
.you, .worth { margin:0 0 16px; padding:12px 14px; border-radius:8px; }
.you { background:var(--you-bg); border:1px solid var(--you); } .you h2 { color:var(--you); }
.you .card:last-child { margin-bottom:0; }
.you .card { padding:7px 9px; margin-bottom:6px; }
.you .card .t, .you .card .sm { white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.you .card .sm { margin-top:1px; }
.you .card .s { margin-top:2px; font-size:11px; }
.worth { background:var(--panel); border:1px solid var(--line); }
.worth.plain { background:none; border:0; padding:0; }
.you:empty, .worth:empty { display:none; }
.board { display:grid; grid-template-columns:repeat(4, minmax(0,1fr)); gap:12px; align-items:start; }
@media (max-width:1100px) { .board { grid-template-columns:repeat(2, minmax(0,1fr)); } }
@media (max-width:640px) { .board { grid-template-columns:1fr; } }
.col { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; min-height:80px; }
.card { border:1px solid var(--line); border-radius:6px; padding:9px 10px; margin:0 0 8px;
  cursor:pointer; background:var(--panel); transition:border-color .12s ease-out; }
.card:hover, .chip:hover { border-color:var(--muted); }
.card:last-child { margin-bottom:0; }
.card .t { font-weight:600; }
.card .s { color:var(--muted); font-size:12px; margin-top:2px; }
.card .o { margin-top:6px; padding-top:6px; border-top:1px solid var(--line); }
.ruled_out { opacity:.8; }
.youcard { border-color:var(--you); }
.amber, .card .s.amber { color:var(--warn); font-weight:600; }
.empty { color:var(--muted); font-size:13px; padding:2px 0; }
.worth ul { margin:0; padding-left:18px; } .worth li { margin:2px 0; }
.worth .files { color:var(--muted); font-size:12px; }
.card .sm, .chip .sm { color:var(--muted); font-size:12px; margin-top:2px; font-weight:400; display:block; }
.lnk { font:inherit; color:var(--run); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; text-align:left; }
.lnk:focus-visible, .dx:focus-visible, .dback:focus-visible { outline:2px solid var(--run); outline-offset:2px; }
/* Drawer */
.drawer { display:none; position:fixed; top:0; right:0; bottom:0; width:min(620px, 100vw); z-index:10; flex-direction:column;
  background:var(--panel); border-left:1px solid var(--line); box-shadow:-6px 0 24px rgba(0,0,0,.18); }
.drawer.on { display:flex; }
@media (min-width:900px) { body.dopen { padding-right:min(620px, 45vw); }
  body.dopen .board { grid-template-columns:repeat(2, minmax(0,1fr)); } }
.dh { display:flex; gap:10px; align-items:flex-start; padding:12px 14px; border-bottom:1px solid var(--line); }
.dh > div { flex:1; min-width:0; }
.dt { font-size:16px; font-weight:600; overflow-wrap:anywhere; }
.ds { color:var(--muted); font-size:12px; margin-top:2px; }
.dx, .dback { font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:3px 10px; cursor:pointer; }
.db { flex:1; overflow:auto; padding:12px 14px 24px; }
.facts { display:grid; grid-template-columns:max-content 1fr; gap:3px 12px; margin:0 0 12px; font-size:13px; }
.facts dt { color:var(--muted); } .facts dd { margin:0; overflow-wrap:anywhere; }
.facts dd .lnk, .worth .files .lnk { margin-right:10px; }
.dmsg { color:var(--muted); padding:8px 0; }
.md { overflow-wrap:anywhere; }
.md h3, .md h4 { margin:14px 0 4px; font-size:15px; } .md h4 { font-size:13px; }
.md p { margin:0 0 8px; } .md ul, .md ol { margin:0 0 8px; padding-left:20px; } .md li { margin:1px 0; }
.md code { background:var(--code); border-radius:3px; padding:0 4px; font:12px ui-monospace, Menlo, monospace; }
.md pre { background:var(--code); border-radius:6px; padding:8px 10px; margin:0 0 8px; overflow:auto; white-space:pre;
  font:12px/1.4 ui-monospace, Menlo, monospace; }
.md blockquote { margin:0 0 8px; padding-left:10px; border-left:3px solid var(--line); color:var(--muted); }
.md hr { border:0; border-top:1px solid var(--line); margin:12px 0; }
.src { margin:0; overflow:auto; font:12px/1.45 ui-monospace, Menlo, monospace; counter-reset:ln; white-space:pre; }
.src .l { display:block; counter-increment:ln; }
.src .l::before { content:counter(ln); display:inline-block; width:4ch; margin-right:1.5ch; text-align:right; color:var(--muted); user-select:none; }
/* Plan */
.plan { display:flex; flex-wrap:wrap; gap:12px; align-items:flex-start; overflow-x:auto; padding-bottom:8px; }
.wave { flex:1 1 600px; min-width:260px; background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; }
.wave.now { border-color:var(--run); }
.wave.ideas { border-style:dashed; background:transparent; }
.wave .row { display:flex; flex-wrap:wrap; gap:6px; margin:0 0 6px; }
.wave .sum { margin-top:10px; padding-top:8px; border-top:1px solid var(--line); }
.chip { flex:1 1 200px; text-align:left; font:inherit; color:var(--ink); background:var(--bg); border:1px solid var(--line);
  border-radius:6px; padding:6px 8px; cursor:pointer; }
.chip.p2 { border-style:dashed; }
.chip .w { color:var(--muted); }
.chip .w { font-size:11px; font-weight:600; text-transform:uppercase; letter-spacing:.04em; }
.chip .x { display:block; color:var(--muted); font-size:12px; }
.chip.st-doing .w { color:var(--run); }
.chip.st-review .w { color:var(--review); }
.chip.st-done .w { color:var(--done); }
.chip.st-dropped { opacity:.75; }
.chip.st-blocked { border-color:var(--you); } .chip.st-blocked .w { color:var(--you); }
.chip.hl { background:var(--hl); } .chip.sel { outline:2px solid var(--ink); }
.idea { border:1px dashed var(--line); border-radius:6px; padding:5px 8px; margin:0 0 6px; color:var(--muted); }
.legend { color:var(--muted); font-size:12px; margin:0 0 10px; }
/* Learned */
.learn { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px 14px; margin:0 0 16px; }
.learn ul { list-style:none; margin:0; padding:0; }
.learn li { padding:6px 0; border-top:1px solid var(--line); cursor:pointer; } .learn li:first-child { border-top:0; }
.learn .id { color:var(--muted); font-size:12px; }
.learn ul ul { margin:4px 0 0 14px; color:var(--muted); font-size:13px; } .learn ul ul li { border:0; padding:1px 0; cursor:default; }
.learn li.dec { cursor:default; }
.learn > button.lnk { margin-top:8px; }
.dect { color:var(--ink); text-decoration:none; } .dect:hover { text-decoration:underline; }
.dect::before { content:"\25B8"; display:inline-block; width:1.1em; color:var(--muted); }
.dect[aria-expanded="true"]::before { content:"\25BE"; }
.learn .dec .md { margin:6px 0 2px 1.1em; font-size:13px; max-width:80ch; }
.learn .md ul, .learn .md ol { list-style:disc; margin:0 0 8px; padding-left:20px; color:var(--ink); }
.learn .md ol { list-style:decimal; } .learn .md li { border:0; padding:1px 0; cursor:default; }
/* Overview */
.ov { display:grid; grid-template-columns:minmax(0,1fr) 380px; gap:16px; align-items:start; }
@media (max-width:1100px) { .ov { grid-template-columns:1fr; } }
@media (min-width:900px) { body.dopen .ov { grid-template-columns:1fr; } }
.big, .box { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:14px 18px; }
.big .ds { margin:0 0 10px; }
.big .md { max-width:75ch; }
.big .md h3 { font-size:14px; margin:18px 0 4px; } .big .md h3:first-child { margin-top:0; }
.ovwarn { margin:0 0 10px; padding:7px 10px; border-radius:6px; background:var(--warn-bg); color:var(--ink);
  border-left:3px solid var(--warn); font-size:13px; font-weight:600; }
.hint { color:var(--muted); }
.closedline { margin:10px 0 0; font-size:13px; }
.side { display:flex; flex-direction:column; gap:16px; min-width:0; }
.box { padding:12px 14px; }
.area { display:grid; grid-template-columns:minmax(0,1fr) 80px 9.5em; gap:10px; align-items:center; padding:3px 0; font-size:13px; }
.area .nm { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.area .bar { width:auto; height:6px; }
.area .n { color:var(--muted); font-variant-numeric:tabular-nums; text-align:right; }
.rests { list-style:none; margin:0; padding:0; }
.rests li { display:flex; gap:9px; align-items:flex-start; padding:4px 0; }
.ck { flex:0 0 14px; height:14px; margin-top:3px; border:1.5px solid var(--muted); border-radius:3px;
  display:inline-flex; align-items:center; justify-content:center; font-size:10px; line-height:1; color:var(--panel); }
.ck.on { background:var(--done); border-color:var(--done); }
.rests .lnk { color:var(--ink); text-decoration:none; } .rests .lnk:hover { text-decoration:underline; }
.rests li.dn .lnk { color:var(--muted); }
.rests .st { display:block; color:var(--muted); font-size:12px; }
.rests .st.run { color:var(--run); } .rests .st.you { color:var(--you); }
/* Map */
.mapbar { display:flex; flex-wrap:wrap; gap:8px 16px; align-items:center; margin:0 0 10px; font-size:13px; }
.fg { display:inline-flex; flex-wrap:wrap; gap:4px; align-items:center; } .fg > span { color:var(--muted); margin-right:2px; }
.seg { display:inline-flex; border:1px solid var(--line); border-radius:6px; overflow:hidden; }
.seg button, .tg, .zb { font:inherit; font-size:13px; color:var(--ink); background:var(--panel); border:0; padding:3px 10px; cursor:pointer; }
.seg button + button { border-left:1px solid var(--line); }
.seg button[aria-pressed="true"] { background:var(--ink); color:var(--panel); }
.tg { border:1px solid var(--line); border-radius:999px; color:var(--muted); }
.tg:hover, .zb:hover { border-color:var(--muted); }
.tg[aria-pressed="true"] { color:var(--ink); border-color:var(--ink); background:var(--bg); font-weight:600; }
.mapbar input[type="search"] { font:inherit; font-size:13px; color:var(--ink); background:var(--panel); border:1px solid var(--line);
  border-radius:6px; padding:3px 8px; width:180px; }
.seg button:focus-visible, .tg:focus-visible, .zb:focus-visible, .mapbar input:focus-visible { outline:2px solid var(--run); outline-offset:2px; }
.mapcount { color:var(--muted); font-variant-numeric:tabular-nums; }
.mapwrap { position:relative; background:var(--panel); border:1px solid var(--line); border-radius:8px;
  height:calc(100vh - 290px); min-height:420px; overflow:hidden; }
.mapsvg { width:100%; height:100%; display:block; cursor:grab; touch-action:none; -webkit-user-select:none; user-select:none; }
.mapsvg.grabbing { cursor:grabbing; }
.zoom { position:absolute; right:10px; bottom:10px; display:flex; gap:4px; }
.zb { border:1px solid var(--line); border-radius:6px; min-width:32px; }
.mapmsg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:var(--muted); pointer-events:none; }
.mapkey { position:absolute; left:10px; bottom:10px; color:var(--muted); font-size:12px; background:var(--panel); padding:2px 4px; }
.mapkey i { display:inline-block; width:22px; margin:0 4px 3px 8px; vertical-align:middle; border-top:1.5px solid var(--muted); }
.mapkey i.sp { border-top-style:dashed; } .mapkey i:first-child { margin-left:0; }
.mapkey .gesture { display:none; }
@media (max-width:640px), (hover:none) { .mapkey .desk { display:none; } .mapkey .gesture { display:inline; } }
.mn { cursor:pointer; outline:none; }
.mn:focus-visible { outline:2px solid var(--run); outline-offset:2px; }
.mn rect { fill:var(--panel); stroke:var(--line); stroke-width:1.5; transition:stroke-width .12s ease-out; }
.mn text { fill:var(--ink); font-size:12px; }
.mn .mi { fill:var(--muted); font-size:11px; }
.mn .mw { fill:var(--muted); font-size:10px; font-weight:600; letter-spacing:.04em; }
.mn circle { fill:var(--muted); }
.mn.st-todo rect { stroke:var(--muted); }
.mn.st-doing rect { stroke:var(--run); } .mn.st-doing circle, .mn.st-doing .mw { fill:var(--run); }
.mn.st-review rect { stroke:var(--review); } .mn.st-review circle, .mn.st-review .mw { fill:var(--review); }
.mn.st-done rect { stroke:var(--done); } .mn.st-done circle, .mn.st-done .mw { fill:var(--done); }
.mn.st-blocked rect { stroke:var(--you); fill:var(--you-bg); } .mn.st-blocked circle, .mn.st-blocked .mw { fill:var(--you); }
.mn.st-dropped { opacity:.7; } .mn.st-dropped rect { stroke:var(--out); stroke-dasharray:4 3; }
.mn:hover rect, .mn:focus-visible rect { stroke-width:2.5; }
.mn.sel rect { stroke:var(--ink); stroke-width:2.5; }
.mn.hit rect { fill:var(--hl); }
.mn.dim { opacity:.18; }
.me { fill:none; stroke:var(--muted); stroke-width:1.2; opacity:.6; }
.me.sp { stroke-dasharray:5 4; }
.me.hot { stroke:var(--ink); stroke-width:2; opacity:1; }
.me.dim { opacity:.08; }
.mapsvg marker path { fill:var(--muted); }
.lane { fill:var(--bg); }
.lanet { fill:var(--ink); font-size:13px; font-weight:600; }
.lanen, .colh { fill:var(--muted); font-size:12px; }
/* Below the scale where 12 px text can be read, the Map is structure: keep the boxes and edges, drop the words. */
.mapsvg.k-out .mn text, .mapsvg.k-out .lanet, .mapsvg.k-out .lanen, .mapsvg.k-out .colh { display:none; }
</style>
</head>
<body>
<main>
  <h1 id="title">Cards</h1>
  <p class="goal" id="goal"></p>
  <div class="meta" id="meta"></div>
  <div id="donewrap"></div>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section class="panel" id="p-overview" role="tabpanel"></section>
  <section class="panel" id="p-now" role="tabpanel">
    <section class="you" id="you"></section>
    <section class="worth" id="worth"></section>
    <section class="board" id="board"></section>
    <p class="hint closedline" id="closedline"></p>
  </section>
  <section class="panel" id="p-plan" role="tabpanel"></section>
  <section class="panel" id="p-map" role="tabpanel">
    <div class="mapbar">
      <div class="seg" role="group" aria-label="Layout"><button type="button" data-map-layout="flow">By flow</button><button type="button" data-map-layout="area">By area</button></div>
      <div class="fg"><button type="button" class="tg" data-map-flag="live" title="The live edge: cards running or waiting for review">Live</button><button type="button" class="tg" data-map-flag="open">Open only</button><button type="button" class="tg" data-map-flag="key">What the goal rests on</button><button type="button" class="tg" data-map-flag="spawn">Filed-by lines</button></div>
      <div class="fg" id="map-st"><span>Status</span></div>
      <div class="fg" id="map-pr"><span>Priority</span></div>
      <input type="search" id="map-q" placeholder="Find a card" aria-label="Find a card">
      <span class="mapcount" id="map-count"></span>
    </div>
    <div class="mapwrap">
      <svg class="mapsvg" id="map-svg" role="img" aria-label="Map of cards">
        <defs><marker id="map-arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z"/></marker></defs>
        <g id="map-view"></g>
      </svg>
      <div class="mapmsg" id="map-msg"></div>
      <div class="mapkey"><span class="desk"><i></i>after (waits on)<i class="sp"></i>filed by</span><span class="gesture">drag to pan · pinch to zoom</span></div>
      <div class="zoom"><button type="button" class="zb" data-map-zoom="out" aria-label="Zoom out">&minus;</button><button type="button" class="zb" data-map-zoom="in" aria-label="Zoom in">+</button><button type="button" class="zb" data-map-zoom="fit">Fit</button></div>
    </div>
  </section>
  <section class="panel" id="p-learned" role="tabpanel"></section>
</main>
<aside class="drawer" id="drawer" role="dialog" aria-label="Details" aria-hidden="true"></aside>
<script>
var TABS = [["overview", "Overview"], ["now", "Now"], ["plan", "Plan"], ["map", "Map"], ["learned", "Learned"]];
var COLUMNS = [["running", "Running"], ["review", "To review"], ["next", "Up next"], ["later", "Waiting"],
  ["done", "Done"], ["ruled_out", "Ruled out"]];
var STATUS_WORD = { todo: "waiting", doing: "running", review: "to review", done: "done", dropped: "ruled out", blocked: "needs you" };
var COUNT_WORD = { todo: "waiting", doing: "running", review: "to review", done: "done", dropped: "ruled out", blocked: "blocked" };
var open = {}, tab = "overview", selected = null;
var view = null;          // null, {kind:"card", id} or {kind:"file", path, back}
var files = {};           // path -> {state:"loading"|"ok"|"error", text}
var lastDrawer = "", lastSig = "", opener = null;
try { tab = sessionStorage.getItem("cards-tab") || tab; } catch (e) {}
if (TABS.some(function (t) { return "#" + t[0] === location.hash; })) tab = location.hash.slice(1);
if (!TABS.some(function (t) { return t[0] === tab; })) tab = "overview";

function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function mins(ts) { return ts ? Math.round((Date.now() / 1000 - ts) / 60) : null; }
function span(m) { return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 2880 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; }
function day(ts) { var d = new Date(ts * 1000), now = new Date();
  return d.getDate() + " " + MONTHS[d.getMonth()] + (d.getFullYear() === now.getFullYear() ? "" : " " + d.getFullYear()); }
/* Past 30 days a day count stops meaning anything; show the date. */
function ago(ts) {
  if (!ts) return "";
  var m = mins(ts);
  return m > 43200 ? day(ts) : span(m);
}
function clock(ts) { var d = new Date(ts * 1000); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
/* A clock time only means today; for older data show the day too. */
function stamp(ts) { return ts ? (mins(ts) > 1440 ? day(ts) + " " + clock(ts) : clock(ts)) : "unknown"; }
function isSummary(c) { return (c.tags || []).indexOf("checkin") >= 0; }
function colId(c) { return c.column === "you" ? "youcard" : c.column; }
function cardById(d, id) { for (var i = 0; i < d.cards.length; i++) if (d.cards[i].id === id) return d.cards[i]; return null; }

/* Markdown: small and safe. Everything is escaped first, and links become plain text. */
function inline(s) {
  var parts = s.split("`");
  if (parts.length % 2 === 0) parts = [s];
  return parts.map(function (p, i) {
    if (parts.length > 1 && i % 2) return "<code>" + esc(p) + "</code>";

function bindMap() {
  var svg = document.getElementById("map-svg"), drag = null, pts = {}, pinch = null;
  document.getElementById("map-st").insertAdjacentHTML("beforeend", MAP_ST.map(function (s) {
    return '<button type="button" class="tg" data-map-st="' + s + '">' + esc(STATUS_WORD[s]) + "</button>"; }).join(""));
  document.getElementById("map-pr").insertAdjacentHTML("beforeend", MAP_PR.map(function (p) {

    if (ids.length === 1) drag = { x: pts[ids[0]].x, y: pts[ids[0]].y, vx: MAP.x, vy: MAP.y, moved: false };
    else if (!ids.length) drag = null;

    if (e.button !== 0) return;
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };

    if (ids.length === 2) {
      pinch = { d: Math.hypot(pts[ids[0]].x - pts[ids[1]].x, pts[ids[0]].y - pts[ids[1]].y),
        x: (pts[ids[0]].x + pts[ids[1]].x) / 2, y: (pts[ids[0]].y + pts[ids[1]].y) / 2 };
      drag = null;
    } else if (ids.length === 1) {

        if (MAP.L) {

          if (ax < MAP.x - 24 || ax > MAP.x + w + 24 || ay < MAP.y - 24 || ay > MAP.y + h + 24) {
            MAP.x += ax - (MAP.x + w / 2); MAP.y += ay - (MAP.y + h / 2);
          }
        }
        zoomAt(d / pinch.d, ax, ay);
        MAP.x += mx - pinch.x; MAP.y += my - pinch.y;  // the two fingers also pan

function mapClick(e) {

function cardIds(d, ids) {

}
function drawerHtml(d) {

    var facts = '<dl class="facts"><dt>Status</dt><dd>' + esc(STATUS_WORD[c.status] || c.status) + (c.human ? " (for you)" : "") + "</dd>" +

function openView(v, from) {

function loadFile(p, quiet) {

function render() {

  var y = window.scrollY, plan = document.querySelector(".plan"), sl = plan ? plan.scrollLeft : 0;
  var a = document.activeElement, fk = a && a.getAttribute && (["data-id", "data-chip", "data-dec", "data-more"].filter(function (k) { return a.getAttribute(k); })[0] || null);

document.addEventListener("click", function (e) {
  var d = window.CARDS_STATUS;
  if (e.target.closest("[data-close]")) { closeView(); return; }
  if (e.target.closest("[data-back]")) {
    if (view && view.back) openView({ kind: "card", id: view.back }); return;
  }
  var oc = e.target.closest("[data-open-card]");
  if (oc) { openView({ kind: "card", id: oc.getAttribute("data-open-card") }, oc); return; }
  var fb = e.target.closest("[data-file]");
  if (fb) {
    openView({ kind: "file", path: fb.getAttribute("data-file"), back: view && view.kind === "card" ? view.id : (view && view.back) || null }, fb);
    return;
  }
  if (mapClick(e)) return;
  var dc = e.target.closest("[data-dec]");
  if (dc) { var dk = "D" + dc.getAttribute("data-dec"); open[dk] = !open[dk]; render(); return; }
  var t = e.target.closest("[data-tab]");
  if (t) {
    tab = t.getAttribute("data-tab");
    try { sessionStorage.setItem("cards-tab", tab); if (location.hash) history.replaceState(null, "", location.pathname + location.search); } catch (x) {}
    render(); return;
  }
  var chip = e.target.closest("[data-chip]");
  if (chip) {
    var id = chip.getAttribute("data-chip"); selected = selected === id ? null : id; render();
    if (selected) openView({ kind: "card", id: selected }, document.querySelector('[data-chip="' + id + '"]'));
    return;
  }
  var li = e.target.closest("[data-learn]");
  if (li && !e.target.closest("li li")) { var k = "L" + li.getAttribute("data-learn"); open[k] = !open[k]; render(); return; }
  var more = e.target.closest("[data-more]");
  if (more) { var mk = more.getAttribute("data-more"); open[mk] = !open[mk]; render(); return; }

  if (el) openView({ kind: "card", id: el.getAttribute("data-id") }, el);
});
document.addEventListener("keydown", function (e) {

  if ((e.key === "Enter" || e.key === " ") && e.target.classList && (e.target.classList.contains("card") || e.target.classList.contains("mn"))) {

function reload() {
