<script>
var TABS = [["overview", "Overview"], ["now", "Now"], ["plan", "Road to done"], ["map", "Map"], ["learned", "What we found"]];
var COLUMNS = [["running", "Running"], ["review", "To review"], ["next", "Up next"], ["later", "Waiting"],
  ["done", "Done"], ["ruled_out", "Ruled out"]];
var STATUS_WORD = { todo: "waiting", doing: "running", review: "to review", done: "done", dropped: "ruled out", blocked: "needs you" };
var COUNT_WORD = { todo: "waiting", doing: "running", review: "to review", done: "done", dropped: "ruled out", blocked: "blocked" };
var open = {}, tab = "overview";
var view = null;          // null, {kind:"card", id} or {kind:"file", path, back}
var files = {};           // path -> {state:"loading"|"ok"|"error", text}
var lastDrawer = "", lastSig = "", opener = null;
/* A #tab in the address wins; otherwise the last tab used on this project comes back once the project name is known. */
var hashTab = TABS.some(function (t) { return "#" + t[0] === location.hash; }), tabRestored = hashTab;
if (hashTab) tab = location.hash.slice(1);
function tabKey() { return "cards-tab:" + ((window.CARDS_STATUS && window.CARDS_STATUS.project) || ""); }
function restoreTab() {
  if (tabRestored || !window.CARDS_STATUS) return;
  tabRestored = true;
  try { var t = localStorage.getItem(tabKey()); if (TABS.some(function (x) { return x[0] === t; })) tab = t; } catch (e) {}
}
function setTab(t) {

}

function esc(t) { return String(t == null ? "" : t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
function mins(ts) { return ts ? Math.round((Date.now() / 1000 - ts) / 60) : null; }
function span(m) { return m < 1 ? "just now" : m < 60 ? m + " min ago" : m < 2880 ? Math.round(m / 60) + " h ago" : Math.round(m / 1440) + " d ago"; }
function day(ts) { var d = new Date(ts * 1000), now = new Date();
  return d.getDate() + " " + MONTHS[d.getMonth()] + (d.getFullYear() === now.getFullYear() ? "" : " " + d.getFullYear()); }
/* Past 30 days a day count stops meaning anything; show the date. */
function ago(ts) {
  if (!ts) return "";
  var m = mins(ts);
  return m > 43200 ? day(ts) : span(m);
}
function full(ts) { return ts ? new Date(ts * 1000).toLocaleString() : ""; }
/* An age in the page, with the exact date and time on hover. */
function agoH(ts) { return ts ? '<span title="' + esc(full(ts)) + '">' + esc(ago(ts)) + "</span>" : ""; }
function clock(ts) { var d = new Date(ts * 1000); return ("0" + d.getHours()).slice(-2) + ":" + ("0" + d.getMinutes()).slice(-2); }
/* A clock time only means today; for older data show the day too. */
function stamp(ts) { return ts ? (mins(ts) > 1440 ? day(ts) + " " + clock(ts) : clock(ts)) : "unknown"; }
/* Plain time words for the drawer: "today at 14:05", "yesterday", "on Tuesday", "on 4 Nov". */
var WEEKDAYS = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"];
function whenWord(ts) {
  var x = new Date(ts * 1000), n = new Date();
  var days = Math.round((new Date(n.getFullYear(), n.getMonth(), n.getDate()) - new Date(x.getFullYear(), x.getMonth(), x.getDate())) / 864e5);
  return days <= 0 ? "today at " + clock(ts) : days === 1 ? "yesterday" : days < 7 ? "on " + WEEKDAYS[x.getDay()] : "on " + day(ts);
}
function sinceWord(ts) { return whenWord(ts).replace(/^today at |^on /, ""); }
function lasted(ts) { var m = Math.max(mins(ts), 1); return m < 2 ? "a minute" : m < 90 ? m + " minutes" : m < 2880 ? Math.round(m / 60) + " hours" : Math.round(m / 1440) + " days"; }
/* One sentence in words for where a card stands: [text, timestamp for the hover, tone]. */
function statusSentence(c) {
  var n = (c.waiting_on || []).length;
  if (c.column === "you") return c.waiting_since ? ["Waiting on you since " + sinceWord(c.waiting_since), c.waiting_since, "you"] : ["Waiting on you", 0, "you"];
  if (c.column === "running") return c.started ? ["Running for " + lasted(c.started) + (c.attempts > 1 ? ", attempt " + c.attempts : ""), c.started, "run"] : ["Running", 0, "run"];
  if (c.column === "review") return c.touched ? ["Finished " + whenWord(c.touched) + ", waiting for a check", c.touched, "run"] : ["Finished, waiting for a check", 0, "run"];
  if (c.column === "done") return c.finished ? ["Done " + whenWord(c.finished), c.finished, "done"] : ["Done", 0, "done"];
  if (c.column === "ruled_out") return c.finished ? ["Ruled out " + whenWord(c.finished), c.finished, ""] : ["Ruled out", 0, ""];
  if (c.column === "next") return ["Ready to start: the next free agent picks it up", 0, ""];
  return [n ? "Waiting for " + (n === 1 ? "one other card" : n + " other cards") + " to finish first" : "Waiting its turn", c.filed || 0, ""];
}
function isSummary(c) { return (c.tags || []).indexOf("checkin") >= 0; }
function colId(c) { return c.column === "you" ? "youcard" : c.column; }
/* The plain lines a card writes for the human (D-037). Older status files have none. */
function fyOf(c) { var f = c.for_you || {}, o = {};
  ["need", "why", "how", "means", "background"].forEach(function (k) { o[k] = String(f[k] || "").trim(); }); return o; }
function plainOpen(c) { var f = fyOf(c); return f.need || c.summary || c.title; }

function newest(a, b) { return (b.finished || 0) - (a.finished || 0); }
function cardById(d, id) { for (var i = 0; i < d.cards.length; i++) if (d.cards[i].id === id) return d.cards[i]; return null; }

/* Markdown: small and safe. Everything is escaped first, and links become plain text. */
function inline(s) {
  var parts = s.split("`");
  if (parts.length % 2 === 0) parts = [s];
  return parts.map(function (p, i) {
    if (parts.length > 1 && i % 2) return "<code>" + esc(p) + "</code>";
    return esc(p).replace(/\[([^\]]+)\]\([^)]*\)/g, "$1").replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[^*\w])\*([^*\s][^*]*)\*(?!\w)/g, "$1<i>$2</i>");

function md(text) {
  var lines = String(text || "").replace(/\r/g, "").split("\n"), out = [], i = 0, para = [];
  var isList = /^\s*([-*]|\d+\.)\s+/;
  function flush() { if (para.length) out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; }
  while (i < lines.length) {
    var l = lines[i], m;
    if (/^\s*```/.test(l)) {
      flush(); var code = []; i++;
      while (i < lines.length && !/^\s*```/.test(lines[i])) code.push(lines[i++]);
      i++; out.push("<pre>" + esc(code.join("\n")) + "</pre>"); continue;
    }
    if ((m = /^(#{1,6})\s+(.*)$/.exec(l))) { flush(); var t = m[1].length <= 2 ? "h3" : "h4"; out.push("<" + t + ">" + inline(m[2]) + "</" + t + ">"); i++; continue; }
    if (/^\s*\|/.test(l)) {
      flush(); var rows = [];
      while (i < lines.length && /^\s*\|/.test(lines[i])) rows.push(lines[i++]);
      out.push("<pre>" + esc(rows.join("\n")) + "</pre>"); continue;
    }
    if (isList.test(l)) {
      flush(); var ordered = /^\s*\d/.test(l), items = [];
      while (i < lines.length && isList.test(lines[i])) {
        var lead = /^\s*/.exec(lines[i])[0].length;
        items.push('<li style="margin-left:' + Math.min(Math.floor(lead / 2), 4) * 16 + 'px">' + inline(lines[i].replace(isList, "")) + "</li>"); i++;
      }
      out.push((ordered ? "<ol>" : "<ul>") + items.join("") + (ordered ? "</ol>" : "</ul>")); continue;
    }
    if (/^\s*>/.test(l)) {
      flush(); var q = [];
      while (i < lines.length && /^\s*>/.test(lines[i])) q.push(lines[i++].replace(/^\s*>\s?/, ""));
      out.push("<blockquote>" + inline(q.join(" ")) + "</blockquote>"); continue;
    }
    if (/^\s*(---+|\*\*\*+)\s*$/.test(l)) { flush(); out.push("<hr>"); i++; continue; }
    if (!l.trim()) { flush(); i++; continue; }

}

/* Files: a button that opens the file in the drawer, never a link. */
function fileBtn(path, label) { return '<button type="button" class="lnk" data-file="' + esc(path) + '">' + esc(label || path.split("/").pop()) + "</button>"; }

  var map = d.files || {};

  var dir = p.replace(/\/*$/, "/"), hits = Object.keys(map).filter(function (k) { return k.indexOf(dir) === 0; });

}
function fileButtons(d, paths) {
  var all = [];
  (paths || []).forEach(function (p) { filesFor(d, p).forEach(function (f) { all.push(fileBtn(f, f === p ? null : f.slice(p.replace(/\/*$/, "/").length))); }); });
  return all.join(" ");
}
function briefPath(d) {

function cardHtml(d, c, cls, compact) {

  }
  var sub = c.id + " · " + c.priority, tip = "";

  var d = window.CARDS_STATUS, entry = d && d.files && d.files[p];
  if (!entry || !/^view\/f\d+\.js$/.test(entry)) return;
  if (!quiet || !files[p]) files[p] = { state: "loading" };
  var s = document.createElement("script");
  s.src = entry + "?t=" + Date.now();
  s.onload = function () { s.remove(); };
  s.onerror = function () { s.remove(); if (!files[p] || files[p].state !== "ok") { files[p] = { state: "error" }; renderDrawer(false); } };
  document.body.appendChild(s);
}
window.CARDS_FILE = function (path, text) {
  var old = files[path];
  files[path] = { state: "ok", text: text };
  if (view && view.kind === "file" && view.path === path && !(old && old.state === "ok" && old.text === text)) renderDrawer(false);
};

function render() {
  var d = window.CARDS_STATUS;
  restoreTab();
  if (!d) { document.getElementById("goal").textContent = "No status yet. Run python3 cards/cards.py status in the project and this page fills in."; return; }
  var y = window.scrollY;
  var a = document.activeElement, fk = a && a.getAttribute && (["data-id", "data-open-card", "data-dec", "data-more", "data-concept"].filter(function (k) { return a.getAttribute(k); })[0] || null);
  var fv = fk ? a.getAttribute(fk) : null;
  document.title = d.project + " · cards";
  document.getElementById("title").textContent = d.project;
  document.getElementById("goal").textContent = (d.goal || []).join(" ");
  var pct = d.high_total ? Math.round(100 * d.high_closed / d.high_total) : 0;
  var parts = ['<div class="bar" title="Important cards (P0 and P1) done"><span style="width:' + pct + '%"></span></div>',
    "<span><b>" + d.high_closed + " of " + d.high_total + "</b> important cards done</span>"];
  var counts = [];
  for (var k in d.counts) if (d.counts[k]) counts.push(d.counts[k] + " " + (COUNT_WORD[k] || k));
  if (counts.length) parts.push("<span>" + counts.join(" · ") + "</span>");
  if (d.checkpoint) parts.push("<span>Waiting for you: " + esc(d.checkpoint.title) + "</span>");
  parts.push('<span title="' + esc(new Date(d.updated * 1000).toString()) + '">Updated ' + stamp(d.updated) + "</span>");
  document.getElementById("meta").innerHTML = parts.join("");
  var dw = d.done_when || [], gmet = {};
  (d.goals || []).forEach(function (g) { if (g.met) gmet[g.id] = 1; });
  document.getElementById("donewrap").innerHTML = dw.length ? '<div class="lbl">Done when</div><ul class="dw">' +
    dw.map(function (l) {
      var id = (/^(?:\[met\]\s*)?(D\d+):/.exec(l) || [])[1], met = /^\[met\]/.test(l) || !!gmet[id];
      return "<li" + (met ? ' class="met"' : "") + ">" + esc(l.replace(/^\[met\]\s*/, "")) + (met ? '<span class="metw">met</span>' : "") + "</li>";
    }).join("") + "</ul>" : "";
  var needs = d.cards.filter(function (c) { return c.column === "you"; }).length;
  document.getElementById("tabs").innerHTML = TABS.map(function (t) {
    var label = t[1] + (t[0] === "now" && needs ? " (" + needs + ")" : "");
    return '<button type="button" role="tab" data-tab="' + t[0] + '" aria-selected="' + (t[0] === tab) + '">' + label + "</button>";
  }).join("");
  TABS.forEach(function (t) { document.getElementById("p-" + t[0]).className = "panel" + (t[0] === tab ? " on" : ""); });
  renderOverview(d); renderNow(d); renderPlan(d); renderMap(d); renderLearned(d);
  window.scrollTo(window.scrollX, y);
  if (fv) {
    var again = document.querySelector("[" + fk + '="' + fv.replace(/"/g, "") + '"]');
    if (again && !document.getElementById("drawer").contains(document.activeElement) && again !== document.activeElement) again.focus({ preventScroll: true });
  }
  renderDrawer(false);
}

document.addEventListener("click", function (e) {
  var d = window.CARDS_STATUS;
  if (e.target.closest("[data-close]")) { closeView(); return; }
  var cp = e.target.closest("[data-copy]");
  if (cp) { copyText(cp.getAttribute("data-copy"), cp); return; }
  if (e.target.closest("[data-keys]")) { toggleKeys(); return; }
  if (!e.target.closest("#keys") && !document.getElementById("keys").hidden) toggleKeys(false);
  if (e.target.closest("[data-back]")) {
    if (view && view.back) openView({ kind: view.back.kind, id: view.back.id, name: view.back.name }); return;
  }
  /* From inside the drawer, a card or file opened from an idea or a card keeps a Back button to it. */
  var here = view && e.target.closest("#drawer") ? (view.kind === "file" ? view.back : { kind: view.kind, id: view.id, name: view.name }) : null;
  var oc = e.target.closest("[data-open-card]");
  if (oc) { openView({ kind: "card", id: oc.getAttribute("data-open-card"), back: here && here.kind === "concept" ? here : null }, oc); return; }
  var fb = e.target.closest("[data-file]");
  if (fb) {
    openView({ kind: "file", path: fb.getAttribute("data-file"), back: here }, fb);
    return;
  }
  if (conceptClick(e)) return;
  if (mapClick(e)) return;
  var dc = e.target.closest("[data-dec]");
  if (dc) { var dk = "D" + dc.getAttribute("data-dec"); open[dk] = !open[dk]; render(); return; }
  var t = e.target.closest("[data-tab]");
  if (t) {
    setTab(t.getAttribute("data-tab")); return;
  }
  var li = e.target.closest("[data-learn]");
  if (li && !e.target.closest("li li")) { var k = "L" + li.getAttribute("data-learn"); open[k] = !open[k]; render(); return; }
  var more = e.target.closest("[data-more]");
  if (more) { var mk = more.getAttribute("data-more"); open[mk] = !open[mk]; render(); return; }
  var el = e.target.closest(".card");
  if (el) openView({ kind: "card", id: el.getAttribute("data-id") }, el);
});
function toggleKeys(on) {
  var k = document.getElementById("keys"), b = document.querySelector("[data-keys]");
  if (on == null) on = k.hidden;
  k.hidden = !on; b.setAttribute("aria-expanded", String(on));
}
document.addEventListener("keydown", function (e) {
  if (e.key === "Escape" && !document.getElementById("keys").hidden) { toggleKeys(false); return; }
  if (e.key === "Escape" && view) { closeView(); return; }
  /* Single-key shortcuts never fire while typing or with a modifier held. */
  var tg = e.target, typing = tg && (tg.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
  if (!typing && !e.ctrlKey && !e.metaKey && !e.altKey) {
    if (/^[1-9]$/.test(e.key) && TABS[+e.key - 1]) { e.preventDefault(); setTab(TABS[+e.key - 1][0]); return; }
    if (e.key === "/") {
      e.preventDefault();
      if (tab === "learned" && (window.CARDS_STATUS && (window.CARDS_STATUS.concepts || []).length)) { document.getElementById("cm-q").focus(); return; }
      if (tab !== "map") setTab("map"); document.getElementById("map-q").focus(); return;
    }
    if (e.key === "?") { e.preventDefault(); toggleKeys(); return; }
  }
  if ((e.key === "Enter" || e.key === " ") && e.target.classList && (e.target.classList.contains("card") || e.target.classList.contains("mn") || e.target.classList.contains("cn"))) {
    e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true }));
  }
});
/* Theme: System follows the OS, Light and Dark pin it; the choice is remembered per browser (same key as the v10 edit). */
(function () {
  var root = document.documentElement, box = document.getElementById("theme"), mem = "";
  function choice() {
    if (mem) return mem;
    try { return localStorage.getItem("cards-theme") || "auto"; } catch (e) { return "auto"; }
  }
  function paint() {
    var mode = choice();
    if (mode === "light" || mode === "dark") root.setAttribute("data-theme", mode); else root.removeAttribute("data-theme");
    Array.prototype.forEach.call(box.querySelectorAll("[data-theme-set]"), function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-theme-set") === mode));
    });
  }
  box.addEventListener("click", function (e) {
    var b = e.target.closest("[data-theme-set]");
    if (!b) return;
    mem = b.getAttribute("data-theme-set");
    try { localStorage.setItem("cards-theme", mem); } catch (x) {}  /* file:// may block storage; the page still switches */
    paint();
  });
  paint();
})();
function reload() {
  var s = document.createElement("script");
  s.src = "status.js?t=" + Date.now();
  s.onload = function () {
    render(); s.remove();
    if (view && view.kind === "file") loadFile(view.path, true);
  };
  s.onerror = function () { s.remove(); };
  document.body.appendChild(s);
}
reload();
setInterval(reload, 5000);
</script>
